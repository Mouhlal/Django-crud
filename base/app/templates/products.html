<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Liste des Produits</title>
</head>
<body>

    <h1>Products</h1>
    <ul>
        {% for product in products %}
            <li>
                {{ product.name }}
                <p>Price: {{ product.price }}</p>
                <p>Description: {{ product.description }}</p>
                <p>Category: {{ product.category.name }}</p>
            </li>
        {% endfor %}
    </ul>

</body>
</html>
