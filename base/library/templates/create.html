<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un Auteur</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header">
            <h2 class="text-center">Ajouter un Auteur</h2>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}

                {% if form.errors %}
                    <div class="alert alert-danger">
                        <ul>
                            {% for field in form %}
                                {% for error in field.errors %}
                                    <li>{{ error }}</li>
                                {% endfor %}
                            {% endfor %}
                        </ul>
                    </div>
                {% endif %}

                <div class="mb-3">
                    <label for="id_name" class="form-label">Nom</label>
                    {{ form.name }}
                </div>

                <div class="mb-3">
                    <label for="id_email" class="form-label">Email</label>
                    {{ form.email }}
                </div>

                <div class="mb-3">
                    <label for="id_bio" class="form-label">Biographie</label>
                    {{ form.bio }}
                </div>

                <div class="mb-3">
                    <label for="id_annee_naissance" class="form-label">Année de naissance</label>
                    {{ form.annee_naissance }}
                </div>

                <button type="submit" class="btn btn-primary w-100">Ajouter</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
